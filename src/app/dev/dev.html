    class="github-link btn-link-bg btn-link-bg-hover link-container"
  >
    <div class="github-logo-container">
      <img
        alt="GitHub Logo"
        src="/imgs/3rdparty/github/github-mark.svg"
        class="github-logo-light"
      />

        alt="GitHub Logo"
        src="/imgs/3rdparty/github/github-mark-white.svg"
        class="github-logo-dark"
      />

    <div class="github-label-container">

        ngSrc="/imgs/icons/arrow-right-sm.svg"
        class="external-icon"

        height="16"
      />

</section>
