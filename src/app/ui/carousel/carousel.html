<x-scroll class="img-carousel" style="--scrollbar-margin-block-start: -2.5rem">
  <div class="carousel-container">
    @for (item of media(); track $index) {
      <button
        class="carousel-item"
        [routerLink]="['media', item.src | filename]"
        [class.is-video]="item.type === 'video'"
        [attr.aria-label]="item.type === 'image' ? item.alt || 'View image' : 'Play video'"
      >
        <img
          class="carousel-image"
          [ngSrc]="item.type === 'image' ? item.src : item.thumbnailSrc!"
          [alt]="item.type === 'image' ? item.alt : ''"
          height="192"
          width="300"
        />
      </button>
    }
  </div>
</x-scroll>
